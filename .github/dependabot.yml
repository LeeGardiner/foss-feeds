version: 2
updates:
  # ── npm dependencies (server) ──────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Roll routine minor + patch bumps into a single PR to cut noise.
      # Major bumps still arrive as separate PRs for manual review.
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # ── Dockerfile base image (node:24-alpine) ─────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"

  # ── GitHub Actions used in workflows ───────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(actions)"
