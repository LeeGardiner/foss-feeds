name: CI

# The "did this break it?" gate: validate feeds.json and prove a real build
# produces a working site. No secrets, no deploy. Also queues safe Dependabot
# bumps for auto-merge once the owner approves.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # The gate: install the locked dependencies, validate feeds.json, run a real
  # build against the live feeds, and serve the result. If any step fails,
  # nothing merges.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: feeds.json is valid
        run: npm run check
      - name: Build produces a site
        run: |
          OUT_DIR=/tmp/site node scripts/build-static.js
          test -s /tmp/site/index.html
          node -e "const d=require('/tmp/site/api/feeds.json'); if(!d.items.length) process.exit(1); console.log(d.items.length+' items')"
      - name: Preview serves it
        run: |
          OUT_DIR=/tmp/site PORT=8080 node scripts/preview.js &
          pid=$!
          ok=0
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/api/feeds.json >/dev/null && curl -sf http://localhost:8080/ >/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "::error::preview did not serve the built site"; exit 1; fi
          echo "smoke OK"

  # Only after the smoke gate passes: queue Dependabot patch/minor bumps for
  # auto-merge. main requires a code-owner review, so they merge themselves
  # the moment the owner approves. Major bumps are left open for a human.
  dependabot-auto-merge:
    needs: smoke
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Queue for auto-merge (patch + minor only)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
