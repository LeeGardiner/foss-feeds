name: CodeQL

# Static analysis (SAST) of the JavaScript and of the workflows themselves.
# Findings appear under Security → Code scanning; both analyses are required
# checks on main.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC, picks up new queries

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
