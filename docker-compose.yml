services:
  foss-feeds:
    build: .
    image: foss-feeds:latest
    container_name: foss-feeds
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - REFRESH_MIN=5
      - TZ=Europe/London
      - DATA_DIR=/data
      - RETENTION_DAYS=7
      # Optional ntfy alerting (see .env.example). Leave NTFY_URL unset to disable.
      - ALERT_LEVELS=crit,warn
      - ALERT_WINDOW_START=09:00
      - ALERT_WINDOW_END=17:30
      - ALERT_EVERY_MIN=15
      - SUMMARY_AT=09:00
      - SUMMARY_LOOKBACK_H=16
    env_file:
      - path: .env   # optional; holds NTFY_URL / PUBLIC_URL (gitignored)
        required: false
    volumes:
      - ./data:/data   # NeDB persistence (items + alert state)
